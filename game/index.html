<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall — a lantern-keeper's stand</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05070f;
    height: 100%;
  }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
  }
  canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    display: block;
    box-shadow: 0 0 60px rgba(255, 179, 71, 0.12);
    background: #0b1026;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script type="module" src="src/main.js"></script>
</body>
</html>
